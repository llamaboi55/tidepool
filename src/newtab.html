<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="css/tidepool.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="veil" aria-hidden="true"></div>

  <nav class="rail glass" aria-label="Dashboard controls">
    <button class="rail-btn" id="btn-edit" title="Edit layout and links (E)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
      <span class="sr-only">Edit layout and links</span>
    </button>
    <button class="rail-btn" id="btn-scene" title="Next wallpaper (W)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-6 4 4 3-3 6 5M3 4h18v16H3z"/></svg>
      <span class="sr-only">Next wallpaper</span>
    </button>
    <button class="rail-btn" id="btn-calm" title="Calm mode: hide everything but the clock (C)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      <span class="sr-only">Calm mode</span>
    </button>
    <span class="rail-spacer"></span>
    <button class="rail-btn" id="btn-help" title="Keyboard shortcuts (?)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/></svg>
      <span class="sr-only">Keyboard shortcuts</span>
    </button>
    <button class="rail-btn" id="btn-settings" title="Settings (S)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="sr-only">Settings</span>
    </button>
  </nav>

  <main id="stage">
    <section class="zone" id="zone-left" data-zone="left" aria-label="Left widgets"></section>
    <section class="center" id="center" aria-label="Search and favorites"></section>
    <section class="zone" id="zone-right" data-zone="right" aria-label="Right widgets"></section>
    <section class="zone board" id="zone-board" data-zone="board" aria-label="Boards"></section>
  </main>

  <footer class="credit" id="credit"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <aside id="settings" class="sheet glass" aria-label="Settings" hidden></aside>
  <dialog id="dialog" class="glass"></dialog>
</body>
</html>
